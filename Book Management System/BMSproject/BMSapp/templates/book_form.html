<!DOCTYPE html>
<html>
<head>
    <title>Book Form</title>
</head>
<body>
    <h1>
        {% if book %}
            Update Book
        {% else %}
            Add Book
        {% endif %}
    </h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label>
        <input type="text" name="title" value="{{ book.title|default:'' }}" required>
               
        <br><br>

        <label>Author:</label>
        <input type="text" name="author" value="{{ book.author|default:'' }}" required>
        <br><br>

        <label>Price:</label>
        <input type="number" name="price" value="{{ book.price|default:'' }}" step="0.01" required>
        <br><br>

        <button type="submit">Save Book</button>
    </form>

    <br>
    <a href="{% url 'book_list' %}">Back to List</a>
</body>
</html>
